[project]
name = "lifeagent"
version = "0.1.0"
description = "Private, local-first orchestration for LifeAgent workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.19,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28.1,<0.29",
  "jinja2>=3.1,<4",
  "langchain>=1.3,<2",
  "langchain-ollama>=1.1,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "procrastinate[sqlalchemy]>=3.9,<4",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "PyMuPDF>=1.26,<2",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "structlog>=25,<27",
  "uvicorn[standard]>=0.52,<1",
]

[dependency-groups]
dev = [
  "pre-commit>=4,<5",
  "pyright>=1.1.411,<1.2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "respx>=0.22,<1",
  "ruff>=0.16,<0.17",
  "testcontainers[postgres]>=4.10,<5",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "DTZ", "E", "F", "I", "N", "PERF", "PIE", "PT", "RET", "RUF", "S", "SIM", "UP", "W"]
ignore = [
  "S101", # pytest assertions are intentional and production assertions remain reviewable.
]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*.py" = ["E501", "N999"]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
include = ["app"]
exclude = ["app/db/migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"
