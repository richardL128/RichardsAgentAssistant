name: lifeagent

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeagent}
      POSTGRES_USER: ${POSTGRES_USER:-lifeagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeagent-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    image: lifeagent-app:local
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["/usr/local/bin/lifeagent-run-api"]
    environment: &app-environment
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Toronto}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lifeagent}:${POSTGRES_PASSWORD:-lifeagent-dev-only}@postgres:5432/${POSTGRES_DB:-lifeagent}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      ARTIFACT_ROOT: /var/lib/lifeagent/artifacts
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-32gb:latest}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-2048}
      OLLAMA_NUM_BATCH: ${OLLAMA_NUM_BATCH:-32}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_MAX_INPUT_TOKENS: ${OLLAMA_MAX_INPUT_TOKENS:-6000}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-384}
      OLLAMA_REPAIR_ATTEMPTS: ${OLLAMA_REPAIR_ATTEMPTS:-1}
      OLLAMA_SEED: ${OLLAMA_SEED:-1729}
      OLLAMA_REASONING: ${OLLAMA_REASONING:-false}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:-d039cde69ac1f5a43d5134182adfefa65bdb533362a625b936e6171a53296eb3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BASE_DELAY_SECONDS: ${RETRY_BASE_DELAY_SECONDS:-5}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-300}
      RETRY_JITTER_RATIO: ${RETRY_JITTER_RATIO:-0.2}
      CONNECTOR_TIMEOUT_SECONDS: ${CONNECTOR_TIMEOUT_SECONDS:-10}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      QUEUE_STALLED_AFTER_SECONDS: ${QUEUE_STALLED_AFTER_SECONDS:-120}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
      REPOSITORY_ALLOWLIST: ${REPOSITORY_ALLOWLIST:-[]}
      REPOSITORY_ALLOWLIST_VERSION: ${REPOSITORY_ALLOWLIST_VERSION:-}
      DISCORD_TARGET_CHANNELS: ${DISCORD_TARGET_CHANNELS:-[]}
      DISCORD_CODE_REVIEW_CHANNEL_ID: ${DISCORD_CODE_REVIEW_CHANNEL_ID:-}
      GITHUB_WEBHOOK_MAX_BODY_BYTES: ${GITHUB_WEBHOOK_MAX_BODY_BYTES:-1048576}
      GIT_CLONE_TIMEOUT_SECONDS: ${GIT_CLONE_TIMEOUT_SECONDS:-60}
      CODE_COMMAND_TIMEOUT_SECONDS: ${CODE_COMMAND_TIMEOUT_SECONDS:-120}
      CODE_COMMAND_OUTPUT_BYTES: ${CODE_COMMAND_OUTPUT_BYTES:-262144}
      REVIEW_MIN_CONFIDENCE: ${REVIEW_MIN_CONFIDENCE:-0.75}
      CODE_REVIEW_SCHEDULE: ${CODE_REVIEW_SCHEDULE:-18:00}
      CODE_REVIEW_QUICK_SCAN_ENABLED: ${CODE_REVIEW_QUICK_SCAN_ENABLED:-true}
      CODE_REVIEW_CATCHUP_ENABLED: ${CODE_REVIEW_CATCHUP_ENABLED:-false}
      CODE_REVIEW_CATCHUP_MAX_DAYS: ${CODE_REVIEW_CATCHUP_MAX_DAYS:-3}
      CODE_REVIEW_DAILY_MAX_COMMITS: ${CODE_REVIEW_DAILY_MAX_COMMITS:-50}
      CODE_REVIEW_PROFILE_REFRESH_DAYS: ${CODE_REVIEW_PROFILE_REFRESH_DAYS:-30}
      CODE_REVIEW_DISCOVERY_SCOPE: ${CODE_REVIEW_DISCOVERY_SCOPE:-github-installation}
      GITHUB_DISCOVERY_PAGE_SIZE: ${GITHUB_DISCOVERY_PAGE_SIZE:-50}
      GITHUB_MIN_CALL_INTERVAL_SECONDS: ${GITHUB_MIN_CALL_INTERVAL_SECONDS:-2}
      NOTION_ATTACHMENT_MAX_BYTES: ${NOTION_ATTACHMENT_MAX_BYTES:-25165824}
      ACADEMIC_PLAN_HORIZON_DAYS: ${ACADEMIC_PLAN_HORIZON_DAYS:-14}
      ACADEMIC_BUFFER_RATIO: ${ACADEMIC_BUFFER_RATIO:-0.15}
      ACADEMIC_DEFAULT_BLOCK_MINUTES: ${ACADEMIC_DEFAULT_BLOCK_MINUTES:-60}
      ACADEMIC_SYNC_LOOKBACK_DAYS: ${ACADEMIC_SYNC_LOOKBACK_DAYS:-2}
      ACADEMIC_CONFIRMATION_TTL_HOURS: ${ACADEMIC_CONFIRMATION_TTL_HOURS:-24}
      ACADEMIC_MORNING_SCHEDULE: ${ACADEMIC_MORNING_SCHEDULE:-08:00}
      ACADEMIC_END_OF_DAY_SCHEDULE: ${ACADEMIC_END_OF_DAY_SCHEDULE:-21:00}
      FINANCE_MARKET_OPEN_SCHEDULE: ${FINANCE_MARKET_OPEN_SCHEDULE:-09:00}
      OPS_CONSOLE_USERNAME: ${OPS_CONSOLE_USERNAME:-}
      OPS_CONSOLE_PASSWORD: ${OPS_CONSOLE_PASSWORD:-}
      FINANCE_SOURCE_ALLOWLIST_VERSION: ${FINANCE_SOURCE_ALLOWLIST_VERSION:-finance-sources-2026.09}
      DVIDS_API_KEY: ${DVIDS_API_KEY:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      BENZINGA_API_TOKEN: ${BENZINGA_API_TOKEN:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ACADEMIC_CHANNEL_ID: ${DISCORD_ACADEMIC_CHANNEL_ID:-}
      DISCORD_FINANCE_CHANNEL_ID: ${DISCORD_FINANCE_CHANNEL_ID:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_COURSES_DATABASE_ID: ${NOTION_COURSES_DATABASE_ID:-}
      NOTION_ASSESSMENTS_DATABASE_ID: ${NOTION_ASSESSMENTS_DATABASE_ID:-}
      NOTION_STUDY_BLOCKS_DATABASE_ID: ${NOTION_STUDY_BLOCKS_DATABASE_ID:-}
    volumes:
      - artifacts:/var/lib/lifeagent/artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker-code-review:
    image: lifeagent-app:local
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["/usr/local/bin/lifeagent-idle-worker", "code_review"]
    environment: *app-environment
    volumes:
      - artifacts:/var/lib/lifeagent/artifacts
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-academic-planner:
    image: lifeagent-app:local
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["/usr/local/bin/lifeagent-idle-worker", "academic_planner"]
    environment: *app-environment
    volumes:
      - artifacts:/var/lib/lifeagent/artifacts
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-finance:
    image: lifeagent-app:local
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ["/usr/local/bin/lifeagent-idle-worker", "finance"]
    environment: *app-environment
    volumes:
      - artifacts:/var/lib/lifeagent/artifacts
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: lifeagent_postgres_data
  artifacts:
    name: lifeagent_artifacts
