# Main-thread (orchestrator) defaults for this repository.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

approval_policy = "never"

# Sandbox stays on; scope it to this repo only.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = ["/Users/richardliu/Desktop/LifeAgent"]
network_access = true

[agents]
# Enable Codex's local background subagent workflows. This is true by default,
# but is explicit here so the repository's intended workflow is clear.
enabled = true

# Keep one Sol orchestrator plus up to three Luna workers active at a time.
max_concurrent_threads_per_session = 3

# Unnamed/background subagents inherit these defaults. An explicit model in a
# spawn request or custom agent file intentionally takes precedence.
#
# Mid-tier executor model: the strong model stays on the orchestrator, where
# mistakes compound and are not caught. Executors do bounded patches in a fixed
# write scope, checked by ruff/pyright/pytest and the orchestrator's diff
# review, so gpt-5.5 is enough and keeps ChatGPT-plan usage down. Drop to
# gpt-5.4-mini for more headroom, or raise to gpt-5.6-luna if executor patch
# quality is causing rework.
default_subagent_model = "gpt-5.5"
default_subagent_reasoning_effort = "high"