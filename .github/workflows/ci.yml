name: CI

on:
  workflow_dispatch:
    inputs:
      run_docker_acceptance:
        description: Run Phase 8 Docker Compose acceptance checks
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Build frontend assets
        run: |
          npm install --no-save --ignore-scripts tailwindcss@3.4.17
          mkdir -p app/static
          ./node_modules/.bin/tailwindcss \
            --config frontend/tailwind.config.js \
            --input frontend/src/input.css \
            --output app/static/app.css \
            --minify
          cp frontend/src/htmx.min.js app/static/htmx.min.js

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Unit and acceptance tests
        run: uv run pytest tests/unit tests/acceptance

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: lifeagent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lifeagent
          LIFEAGENT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lifeagent
          OLLAMA_BASE_URL: http://stub:11434
          DISCORD_BOT_TOKEN: stub_discord_token
          GITHUB_TOKEN: stub_github_token
          NOTION_TOKEN: stub_notion_token
        run: uv run pytest tests/integration

  docker-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.run_docker_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Phase 8 Docker Compose acceptance
        env:
          LIFEAGENT_RUN_DOCKER_ACCEPTANCE: "1"
          COMPOSE_PROGRESS: plain
          BUILDKIT_PROGRESS: plain
          OLLAMA_BASE_URL: http://127.0.0.1:9
          DISCORD_BOT_TOKEN: stub_discord_token
          NOTION_TOKEN: stub_notion_token
        run: uv run pytest tests/integration/test_phase8_reliability.py
